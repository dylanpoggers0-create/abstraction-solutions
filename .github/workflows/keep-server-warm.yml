# Keeps the quote engine awake during the day so visitors don't wait ~30-60 s for it to wake up.
# Render's free plan puts the server to sleep after 15 minutes with no visits; this pings /health every 10 minutes
# from 6 AM to 11 PM Chicago time (12:00-04:59 UTC). Overnight it's allowed to sleep, which keeps the free plan's
# monthly hours well under the limit. Nothing secret is sent: /health is public.
name: Keep server warm

on:
  schedule:
    - cron: "*/10 12-23 * * *"
    - cron: "*/10 0-4 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # If the server still doesn't answer after ~4 minutes of retries, this run fails, and GitHub emails you
      # (Settings -> Notifications -> Actions: "Send notifications for failed workflows only" should be on).
      - name: Ping the quote engine
        run: |
          for i in 1 2 3 4; do
            if curl -fsS --max-time 90 https://abstraction-quote-engine.onrender.com/health; then echo; echo "Server is up."; exit 0; fi
            echo "No answer (try $i of 4); waiting 30 s..."; sleep 30
          done
          echo "## Server is DOWN" >> "$GITHUB_STEP_SUMMARY"
          echo "The quote engine didn't answer /health for about 4 minutes. Check the Render dashboard (Logs and Events)." >> "$GITHUB_STEP_SUMMARY"
          exit 1
