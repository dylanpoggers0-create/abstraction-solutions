<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin | Abstraction Solutions</title>

    <!-- tells Google not to list this page in search results -->
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/jpeg" href="abstraction_solutions.jpg">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="hydro-admin.css">

    <style>
        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 130px 24px 40px;
        }

        .eyebrow {
            color: var(--green);
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 3px;
        }

        h1 {
            font-size: 2.6rem;
            margin: 10px 0 24px;
        }

        /* ---------- shared box style ---------- */
        input,
        select {
            background-color: rgba(11, 16, 12, 0.92);
            color: white;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px 14px;
            font: inherit;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--green);
            box-shadow: 0 0 14px var(--green-dim);
        }

        .msg {
            min-height: 1.4em;
            color: #ff8a80;
        }

        /* ---------- TABS ---------- */
        main.wide { max-width: 1200px; }

        .tabs {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 0 22px;
            border-bottom: 1px solid var(--line);
        }

        .tabs #logoutButton { margin-left: auto; margin-bottom: 8px; }

        .tab {
            background: none;
            border: 0;
            border-bottom: 3px solid transparent;
            color: var(--text-muted);
            font: inherit;
            font-weight: bold;
            padding: 10px 14px;
            cursor: pointer;
        }

        .tab.active { color: var(--green); border-bottom-color: var(--green); }

        /* ---------- LOGIN ---------- */
        #loginForm {
            max-width: 420px;
            margin: 40px auto 0;        /* auto left/right = centered */
        }

        #loginForm label {
            display: block;
            margin-bottom: 8px;
            color: var(--green);
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 2px;
        }

        #loginForm input {
            width: 100%;
            margin-bottom: 18px;
        }

        #loginForm .pill-container {
            justify-content: center;
            margin: 20px 0;
        }

        #loginMsg {
            text-align: center;
        }

        /* ---------- DASHBOARD ---------- */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .toolbar .count {
            margin-right: auto;
            color: var(--text-muted);
        }

        .small-btn {
            background-color: black;
            color: white;
            border: 1px solid var(--nav-line);
            border-radius: 50px;
            padding: 8px 16px;
            font: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        .small-btn:hover {
            border-color: white;
        }

        .order {
            background-color: rgba(11, 16, 12, 0.92);
            border: 1px solid var(--line);
            border-left: 4px solid var(--green);
            border-radius: 16px;
            padding: 20px 22px;
            margin-bottom: 16px;
        }

        .order.in_progress {
            border-left-color: #f5c451;     /* yellow stripe = in progress */
        }

        .order.complete {
            border-left-color: #5d6b60;     /* gray stripe = complete */
            opacity: 0.75;
        }

        .order .code {
            color: var(--green);
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* quote box: $ sign + number + Save */
        .quote-box {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .quote-box input {
            width: 120px;
        }

        .paid-badge {
            display: inline-block;
            margin-left: 8px;
            padding: 2px 10px;
            border-radius: 50px;
            background-color: var(--green);
            color: black;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .saved {
            color: var(--green);
            font-size: 0.9rem;
        }

        .order-top {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
        }

        .order h3 {
            margin: 0;
            font-size: 1.2rem;
        }

        .order .when {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .order .meta {
            color: var(--text-muted);
            margin: 0 0 12px;
        }

        .order .meta a {
            color: var(--green);
        }

        .order .details {
            white-space: pre-wrap;           /* keep the customer's line breaks */
            line-height: 1.6;
            margin: 0 0 16px;
        }

        .order-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .complete-btn {
            background-color: var(--green-soft);
            color: var(--green);
            border: 1px solid var(--green-dim);
            border-radius: 50px;
            padding: 10px 18px;
            font: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        .delete-btn {
            margin-left: auto;
            background-color: transparent;
            color: #ff8a80;
            border: 1px solid rgba(255, 138, 128, 0.4);
            border-radius: 50px;
            padding: 10px 18px;
            font: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        .delete-btn.confirm {
            background-color: #ff8a80;
            color: black;
        }

        .complete-btn.confirm {
            background-color: var(--green);
            color: black;
        }

        .empty {
            color: var(--text-muted);
        }

        @media (max-width: 600px) {
            main {
                padding: 110px 20px 30px 40px;   /* room for the Menu tab */
            }

            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<!-- "admin" isn't in the menu on purpose: only you know this page exists -->
<body data-page="admin">

    <div id="site-nav"></div>
    <script src="nav.js"></script>

    <main>
        <div class="eyebrow">ADMIN</div>
        <h1 id="adminTitle">Orders</h1>

        <!-- LOGIN (shown until you log in) -->
        <form id="loginForm">
            <label for="username">USERNAME</label>
            <input id="username" type="text" required autocomplete="username">

            <label for="password">PASSWORD</label>
            <input id="password" type="password" required autocomplete="current-password">
            <div class="pill-container">
                <button class="pill primary" id="loginButton" type="submit">Log in</button>
            </div>
            <p class="msg" id="loginMsg" role="alert"></p>
        </form>

        <!-- DASHBOARD (hidden until you log in) -->
        <section id="dashboard" hidden>
            <!-- TABS: Orders (from the server) and Hydro Cart (from the cart app on this computer) -->
            <div class="tabs" role="tablist">
                <button class="tab active" id="tabOrders" type="button" role="tab">Orders</button>
                <button class="tab" id="tabHydro" type="button" role="tab">Hydro Cart</button>
                <button class="small-btn" id="logoutButton" type="button">Log out</button>
            </div>

            <div id="ordersPanel">
                <div class="toolbar">
                    <span class="count" id="orderCount"></span>
                    <button class="small-btn" id="refreshButton" type="button">Refresh</button>
                </div>
                <p class="msg" id="dashMsg" role="alert"></p>
                <div id="orderList"></div>
            </div>

            <!-- filled in by hydro-admin.js -->
            <div id="hydroPanel" hidden></div>
        </section>
    </main>

    <script src="hydro-admin.js"></script>
    <script>
        const API_BASE = 'https://abstraction-quote-engine.onrender.com';

        const loginForm = document.getElementById('loginForm');
        const loginButton = document.getElementById('loginButton');
        const loginMsg = document.getElementById('loginMsg');
        const dashboard = document.getElementById('dashboard');
        const dashMsg = document.getElementById('dashMsg');
        const orderList = document.getElementById('orderList');

        fetch(API_BASE + '/health').catch(function () {});   // wake the free server

        // ---------- the login token ----------
        // sessionStorage = remembered until you close this browser tab
        function getToken() {
            try { return sessionStorage.getItem('adminToken'); } catch (e) { return null; }
        }
        function setToken(token) {
            try {
                if (token) sessionStorage.setItem('adminToken', token);
                else sessionStorage.removeItem('adminToken');
            } catch (e) {}
            memoryToken = token;
        }
        let memoryToken = getToken();

        // every admin request goes through here, with the token attached
        async function api(path, options) {
            options = options || {};
            options.headers = Object.assign({ 'Authorization': 'Bearer ' + memoryToken }, options.headers);
            const response = await fetch(API_BASE + path, options);
            if (response.status === 401 || response.status === 403) {   // token missing or expired
                logout('Your login expired. Please log in again.');
                throw new Error('logged out');
            }
            if (!response.ok) throw new Error('Server error (' + response.status + ')');
            return response.json();
        }

        // ---------- log in / log out ----------
        loginForm.addEventListener('submit', async function (event) {
            event.preventDefault();
            loginButton.disabled = true;
            loginButton.textContent = 'Checking...';
            loginMsg.textContent = '';
            try {
                const response = await fetch(API_BASE + '/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                if (response.status === 401) throw new Error('Wrong username or password.');
                if (response.status === 429) throw new Error('Too many attempts. Wait a minute and try again.');
                if (!response.ok) throw new Error('Server error (' + response.status + ').');
                setToken((await response.json()).token);
                document.getElementById('password').value = '';
                showDashboard();
            } catch (error) {
                loginMsg.textContent = error instanceof TypeError
                    ? 'Can\'t reach the server. It may be waking up: try again in a minute.'
                    : error.message;
            } finally {
                loginButton.disabled = false;
                loginButton.textContent = 'Log in';
            }
        });

        function logout(message) {
            setToken(null);
            showTab('orders');
            dashboard.hidden = true;
            loginForm.hidden = false;
            loginMsg.textContent = message || '';
        }

        document.getElementById('logoutButton').addEventListener('click', function () { logout(); });

        // ---------- tabs ----------
        function showTab(name) {
            const hydro = name === 'hydro';
            document.getElementById('tabOrders').classList.toggle('active', !hydro);
            document.getElementById('tabHydro').classList.toggle('active', hydro);
            document.getElementById('ordersPanel').hidden = hydro;
            document.getElementById('hydroPanel').hidden = !hydro;
            document.getElementById('adminTitle').textContent = hydro ? 'Hydro Cart' : 'Orders';
            document.querySelector('main').classList.toggle('wide', hydro);
            if (hydro) window.HydroAdmin.start();
            else if (window.HydroAdmin) window.HydroAdmin.stop();
        }
        document.getElementById('tabOrders').addEventListener('click', function () { showTab('orders'); });
        document.getElementById('tabHydro').addEventListener('click', function () { showTab('hydro'); });
        document.getElementById('refreshButton').addEventListener('click', loadOrders);

        function showDashboard() {
            loginForm.hidden = true;
            dashboard.hidden = false;
            loadOrders();
        }

        // ---------- show the orders ----------
        async function loadOrders() {
            dashMsg.textContent = '';
            try {
                const orders = await api('/admin/orders');
                document.getElementById('orderCount').textContent =
                    orders.length + ' order' + (orders.length === 1 ? '' : 's') + ' · ' +
                    orders.filter(function (o) { return o.status !== 'complete'; }).length + ' open';
                orderList.replaceChildren();
                if (!orders.length) {
                    const p = document.createElement('p');
                    p.className = 'empty';
                    p.textContent = 'No orders yet.';
                    orderList.append(p);
                }
                orders.forEach(function (order) { orderList.append(orderCard(order)); });
            } catch (error) {
                if (error.message !== 'logged out') dashMsg.textContent = 'Couldn\'t load orders: ' + error.message;
            }
        }

        // small helper: make an element with some text (textContent keeps it safe)
        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined) node.textContent = text;
            return node;
        }

        // send a change (status and/or quote) for one order
        function patchOrder(order, changes) {
            return api('/admin/orders/' + order.id, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(changes)
            });
        }

        function orderCard(order) {
            const card = el('article', 'order ' + order.status);

            const top = el('div', 'order-top');
            const title = el('h3', '', order.name + ' · ');
            title.append(el('span', 'code', order.confirmation));
            if (order.paid_at) title.append(el('span', 'paid-badge', 'Paid ' + new Date(order.paid_at).toLocaleDateString()));
            top.append(title, el('span', 'when', new Date(order.created_at).toLocaleString()));

            const meta = el('p', 'meta', order.service + ' · ');
            const email = el('a', '', order.email);
            email.href = 'mailto:' + order.email;
            meta.append(email);

            const details = el('p', 'details', order.details);

            // status dropdown: new -> in progress -> complete
            const status = el('select');
            status.setAttribute('aria-label', 'Status');
            [['new', 'New'], ['in_progress', 'In progress'], ['complete', 'Complete']].forEach(function (pair) {
                const option = el('option', '', pair[1]);
                option.value = pair[0];
                option.selected = order.status === pair[0];
                status.append(option);
            });
            status.addEventListener('change', async function () {
                try {
                    await patchOrder(order, { status: status.value });
                    card.className = 'order ' + status.value;
                } catch (error) {
                    if (error.message !== 'logged out') dashMsg.textContent = 'Couldn\'t update ' + order.confirmation + ': ' + error.message;
                }
            });

            // quote: type dollars, Save -> the customer gets a "your quote is ready" email
            const quoteBox = el('div', 'quote-box');
            const quoteInput = el('input');
            quoteInput.type = 'number';
            quoteInput.min = '0';
            quoteInput.step = '0.01';
            quoteInput.placeholder = 'Quote $';
            quoteInput.setAttribute('aria-label', 'Quote in dollars');
            if (order.quote_cents !== null) quoteInput.value = (order.quote_cents / 100).toFixed(2);
            const saveQuote = el('button', 'small-btn', order.quote_cents === null ? 'Save quote' : 'Update quote');
            saveQuote.type = 'button';
            const saved = el('span', 'saved');
            saveQuote.addEventListener('click', async function () {
                const dollars = parseFloat(quoteInput.value);
                if (isNaN(dollars) || dollars < 0) {
                    saved.textContent = 'Enter an amount';
                    return;
                }
                try {
                    await patchOrder(order, { quote: dollars });
                    saveQuote.textContent = 'Update quote';
                    saved.textContent = '✓ Saved, customer emailed';
                } catch (error) {
                    if (error.message !== 'logged out') dashMsg.textContent = 'Couldn\'t save the quote: ' + error.message;
                }
            });
            quoteBox.append(el('span', '', '$'), quoteInput, saveQuote, saved);
            if (order.paid_at) {   // a paid quote can't change (the server refuses too)
                quoteInput.disabled = true;
                saveQuote.disabled = true;
                saveQuote.textContent = 'Paid';
            }

            // delete (for spam/tests): first click asks, second click deletes for good
            const del = el('button', 'delete-btn', 'Delete');
            del.type = 'button';
            let timer;
            del.addEventListener('click', async function () {
                if (!del.classList.contains('confirm')) {
                    del.classList.add('confirm');
                    del.textContent = 'Click again to delete';
                    timer = setTimeout(function () {
                        del.classList.remove('confirm');
                        del.textContent = 'Delete';
                    }, 4000);
                    return;
                }
                clearTimeout(timer);
                try {
                    await api('/admin/orders/' + order.id, { method: 'DELETE' });
                    card.remove();
                    loadOrders();   // update the count
                } catch (error) {
                    if (error.message !== 'logged out') dashMsg.textContent = 'Couldn\'t delete ' + order.confirmation + ': ' + error.message;
                }
            });

            const actions = el('div', 'order-actions');
            actions.append(status, quoteBox, del);

            card.append(top, meta, details, actions);
            return card;
        }

        // already logged in this tab? go straight to the orders
        if (memoryToken) showDashboard();
    </script>
</body>
</html>
