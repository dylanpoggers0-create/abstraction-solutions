<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Abstraction Solutions: AI Made Simple</title>

    <!-- Favicon Links -->
    <link rel="icon" type="image/jpeg" href="abstraction_solutions.jpg">
    <link rel="shortcut icon" href="abstraction_solutions.jpg">

    <!-- Shared styles (header, side nav, pills, footer...) -->
    <link rel="stylesheet" href="style.css">

    <!-- Styles only the home page uses -->
    <style>
        /* FULLSCREEN VIDEO */
        .video-container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: black;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* UNMUTE BUTTON (bottom-right of the video) */
        .audio-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 10;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border: 1px solid white;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s ease;
        }

        .audio-btn:hover {
            background-color: white;
            color: black;
        }

        .contact {
            text-align: center;
            padding-bottom: 60px;
        }

        @media (max-width: 600px) {
            .video-container {
                height: auto;
                aspect-ratio: 16 / 9;
                margin-top: 90px;
            }

            .audio-btn {
                bottom: 10px;
                right: 10px;
                padding: 6px 12px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>

<!-- data-page tells nav.js which page this is ("Home" shows as the current page) -->
<body data-page="home">

    <!-- The header, Menu tab and side nav are built here by nav.js -->
    <div id="site-nav"></div>
    <script src="nav.js"></script>

    <!-- VIDEO -->
    <div class="video-container" id="home">
        <video id="heroVideo" playsinline preload="auto" poster="ad-thumbnail.jpg">
            <source src="ad1.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <button id="audioToggle" class="audio-btn" type="button">🔇 Unmute</button>
    </div>

    <!-- WHAT WE DO -->
    <section id="services">
        <h2 class="section-title">What we do</h2>
        <p class="section-sub">AI education, ethical AI, and custom tools for people, researchers and companies.</p>
        <div class="pill-container">
            <a class="pill" href="services.html#automation">AI Automation</a>
            <a class="pill" href="services.html#workflows">Custom Workflows</a>
            <a class="pill primary" href="#contact">Get Started</a>
        </div>
    </section>

    <hr>

    <!-- CONTACT -->
    <section class="contact" id="contact">
        <h2 class="section-title">Let's build something</h2>
        <p class="section-sub">Have a project or a question about AI? Reach out.</p>
        <div class="pill-container">
            <a class="pill primary" href="mailto:dylanpoggers0@gmail.com">Email us</a>
        </div>
    </section>

    <footer>© 2026 Abstraction Solutions</footer>

    <!-- VIDEO SOUND CONTROL
         1st play: tries to play WITH sound.
         After that: loops forever on mute, unless the visitor presses Unmute. -->
    <script>
        const video = document.getElementById('heroVideo');
        const audioBtn = document.getElementById('audioToggle');

        // Keep the button text in sync with the video's sound
        function updateButton() {
            audioBtn.textContent = video.muted ? '🔇 Unmute' : '🔊 Mute';
        }

        // Unmute / Mute button
        audioBtn.addEventListener('click', function () {
            video.muted = !video.muted;
            video.play();
            updateButton();
        });

        // When the FIRST play finishes: mute it and loop from then on
        video.addEventListener('ended', function firstPlayDone() {
            video.removeEventListener('ended', firstPlayDone); // only do this once
            video.muted = true;
            video.loop = true;
            video.currentTime = 0;
            video.play();
            updateButton();
        });

        // Start: try with sound. Browsers often block sound until the visitor has
        // clicked the site at least once. If that happens, play muted instead.
        video.muted = false;
        video.play()
            .then(updateButton)
            .catch(function () {
                video.muted = true;
                video.play();
                updateButton();
            });
    </script>

</body>
</html>
