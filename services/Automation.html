    <!-- Styles for this page only -->
    <style>
        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 130px 24px 40px;   /* top padding keeps content below the floating header */
        }

        /* round green back button */
        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid var(--green-dim);
            background-color: var(--green-soft);
            color: var(--green);                                   /* logo green */
            box-shadow: 0 0 14px rgba(126, 233, 111, 0.15);        /* faint glow */
            transition: background-color 0.2s ease, color 0.2s ease,
                        box-shadow 0.2s ease, transform 0.2s ease;
        }

        /* the arrow drawing takes its color from the button */
        .back-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* hover: fills green, arrow turns black, nudges left */
        .back-btn:hover {
            background-color: var(--green);
            color: black;
            box-shadow: 0 0 22px var(--green-dim);
            transform: translateX(-3px);
        }
    </style>
</head>
