<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 66 740 436" role="img" aria-labelledby="t">
  <title id="t">Price optimization model: past sales data goes into a machine learning model, which finds the price on the profit curve that keeps sales high while earning more per unit</title>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="48%" r="60%">
      <stop offset="0" stop-color="#173a1c"/>
      <stop offset="1" stop-color="#050806"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ee96f" stop-opacity=".28"/>
      <stop offset="1" stop-color="#7ee96f" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7ee96f" stroke-opacity=".06"/>
    </pattern>
  </defs>

  <rect width="800" height="520" fill="url(#bgGlow)"/>
  <rect width="800" height="520" fill="url(#grid)"/>

  <g font-family="Arial, sans-serif">
    <!-- ===== step 1: past sales data ===== -->
    <text x="160" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#7ee96f" letter-spacing="2.5">PAST SALES</text>
    <rect x="66" y="118" width="188" height="130" rx="12" fill="#0b100c" stroke="#2f4a33" stroke-width="2"/>
    <g fill="#2f5a35">
      <rect x="84"  y="196" width="16" height="36" rx="3"/>
      <rect x="108" y="176" width="16" height="56" rx="3"/>
      <rect x="132" y="186" width="16" height="46" rx="3"/>
      <rect x="156" y="160" width="16" height="72" rx="3"/>
      <rect x="180" y="170" width="16" height="62" rx="3"/>
      <rect x="204" y="146" width="16" height="86" rx="3" fill="#7ee96f"/>
    </g>
    <!-- price line over the bars -->
    <polyline points="92,168 116,160 140,164 164,150 188,156 212,138" fill="none" stroke="#eaf8d0" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <g fill="#eaf8d0"><circle cx="92" cy="168" r="3.5"/><circle cx="164" cy="150" r="3.5"/><circle cx="212" cy="138" r="3.5"/></g>

    <!-- arrow down to the model -->
    <path d="M160 256 V 290" stroke="#7ee96f" stroke-width="2.5" stroke-dasharray="6 6"/>
    <path d="M152 284 l8 10 l8 -10" fill="none" stroke="#7ee96f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- ===== step 2: the ML model (tiny neural network) ===== -->
    <rect x="86" y="302" width="148" height="104" rx="16" fill="#0b100c" stroke="#7ee96f" stroke-width="2.5"/>
    <rect x="86" y="302" width="148" height="104" rx="16" fill="#7ee96f" opacity=".12" filter="url(#glow)"/>
    <g stroke="#3f7a47" stroke-width="1.5">
      <line x1="118" y1="330" x2="160" y2="322"/><line x1="118" y1="330" x2="160" y2="354"/><line x1="118" y1="330" x2="160" y2="386"/>
      <line x1="118" y1="378" x2="160" y2="322"/><line x1="118" y1="378" x2="160" y2="354"/><line x1="118" y1="378" x2="160" y2="386"/>
      <line x1="160" y1="322" x2="202" y2="354"/><line x1="160" y1="354" x2="202" y2="354"/><line x1="160" y1="386" x2="202" y2="354"/>
    </g>
    <g fill="#0b100c" stroke="#7ee96f" stroke-width="2.5">
      <circle cx="118" cy="330" r="8"/><circle cx="118" cy="378" r="8"/>
      <circle cx="160" cy="322" r="8"/><circle cx="160" cy="354" r="8"/><circle cx="160" cy="386" r="8"/>
    </g>
    <circle cx="202" cy="354" r="10" fill="#7ee96f"/>
    <text x="160" y="432" text-anchor="middle" font-size="13" font-weight="bold" fill="#7ee96f" letter-spacing="2.5">ML MODEL</text>

    <!-- arrow from model to chart -->
    <path d="M244 354 C 280 354, 290 300, 318 290" fill="none" stroke="#7ee96f" stroke-width="2.5" stroke-dasharray="6 6"/>
    <path d="M308 284 l12 5 l-8 10" fill="none" stroke="#7ee96f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- ===== step 3: profit curve and the suggested price ===== -->
    <rect x="330" y="88" width="420" height="380" rx="20" fill="#0b100c" stroke="#2f4a33" stroke-width="2"/>
    <ellipse cx="540" cy="480" rx="200" ry="16" fill="#7ee96f" opacity=".14" filter="url(#glow)"/>

    <!-- axes -->
    <line x1="350" y1="420" x2="730" y2="420" stroke="#3a4a3d" stroke-width="2"/>
    <line x1="350" y1="120" x2="350" y2="420" stroke="#3a4a3d" stroke-width="2"/>
    <text x="730" y="444" text-anchor="end" font-size="12" fill="#9aa69c" letter-spacing="1.5">PRICE →</text>

    <!-- units sold (falls as price rises) -->
    <path d="M350 170 C 480 186, 600 290, 730 392" fill="none" stroke="#9aa69c" stroke-width="2.5" stroke-dasharray="7 7"/>
    <text x="362" y="160" font-size="12" fill="#9aa69c">units sold</text>

    <!-- profit curve with shaded area -->
    <path d="M350 410 C 450 250, 540 150, 600 150 C 660 150, 705 250, 730 330 L 730 420 L 350 420 Z" fill="url(#area)"/>
    <path d="M350 410 C 450 250, 540 150, 600 150 C 660 150, 705 250, 730 330" fill="none" stroke="#7ee96f" stroke-width="4" stroke-linecap="round"/>
    <text x="664" y="150" font-size="13" font-weight="bold" fill="#7ee96f">profit</text>

    <!-- current price -->
    <line x1="477" y1="234" x2="477" y2="420" stroke="#9aa69c" stroke-width="1.5" stroke-dasharray="4 5"/>
    <circle cx="477" cy="234" r="8" fill="#0b100c" stroke="#cfd8d0" stroke-width="3"/>
    <text x="477" y="440" text-anchor="middle" font-size="11" font-weight="bold" fill="#9aa69c" letter-spacing="1.5">CURRENT</text>

    <!-- arrow along the curve to the suggestion -->
    <path d="M492 212 C 520 176, 552 158, 582 154" fill="none" stroke="#eaf8d0" stroke-width="2.5"/>
    <path d="M572 146 l12 8 l-11 9" fill="none" stroke="#eaf8d0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- suggested price (top of the profit curve) -->
    <line x1="600" y1="150" x2="600" y2="420" stroke="#7ee96f" stroke-width="1.5" stroke-dasharray="4 5"/>
    <circle cx="600" cy="150" r="22" fill="#7ee96f" opacity=".5" filter="url(#glow)"/>
    <circle cx="600" cy="150" r="9" fill="#7ee96f" stroke="#eaf8d0" stroke-width="3"/>
    <text x="600" y="440" text-anchor="middle" font-size="11" font-weight="bold" fill="#7ee96f" letter-spacing="1.5">SUGGESTED</text>

    <!-- suggestion card -->
    <rect x="514" y="98" width="172" height="34" rx="17" fill="#7ee96f"/>
    <text x="600" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#06120a" letter-spacing="1">▲ RAISE PRICE HERE</text>
  </g>
</svg>
